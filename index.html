<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>to-d0</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Personal task board</p>
          <h1>to-d0</h1>
        </div>
        <div class="date-chip" id="todayLabel" aria-live="polite"></div>
      </header>

      <section class="task-composer" aria-labelledby="composerTitle">
        <h2 id="composerTitle">Add Task</h2>
        <form id="taskForm" class="task-form" autocomplete="off">
          <label class="field task-title-field">
            <span>Task</span>
            <input
              id="taskTitle"
              name="title"
              type="text"
              maxlength="120"
              placeholder="What needs to get done?"
              required
            >
          </label>

          <label class="field">
            <span>Priority</span>
            <select id="taskPriority" name="priority">
              <option value="normal">Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </label>

          <label class="field">
            <span>Due</span>
            <input id="taskDueDate" name="dueDate" type="date">
          </label>

          <button class="primary-button" type="submit">
            <span aria-hidden="true">+</span>
            Add
          </button>
        </form>
        <p class="form-error" id="formError" role="alert"></p>
      </section>

      <section class="task-toolbar" aria-label="Task controls">
        <div class="filter-group" role="tablist" aria-label="Filter tasks">
          <button class="filter-button is-active" type="button" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-button" type="button" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <label class="search-field">
          <span class="sr-only">Search tasks</span>
          <input id="taskSearch" type="search" placeholder="Search tasks">
        </label>
      </section>

      <section class="stats-grid" aria-label="Task summary">
        <div class="stat">
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="activeCount">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="completedCount">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </section>

      <section class="task-board" aria-labelledby="taskListTitle">
        <div class="board-header">
          <h2 id="taskListTitle">Tasks</h2>
          <button class="ghost-button" id="clearCompleted" type="button" disabled>Clear Completed</button>
        </div>

        <div class="empty-state" id="emptyState">
          <svg aria-hidden="true" viewBox="0 0 160 120" class="empty-asset">
            <rect x="26" y="22" width="108" height="76" rx="8" fill="#f4f0e8" stroke="#25302b" stroke-width="3"></rect>
            <path d="M47 46h44M47 62h62M47 78h34" stroke="#25302b" stroke-width="5" stroke-linecap="round"></path>
            <path d="m113 42 8 8 18-22" fill="none" stroke="#0f8b62" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="33" cy="102" r="8" fill="#ee6c4d"></circle>
            <circle cx="127" cy="106" r="6" fill="#f2b84b"></circle>
          </svg>
          <h3>No matching tasks</h3>
          <p>Add a task or adjust the current filter.</p>
        </div>

        <ul class="task-list" id="taskList" aria-live="polite"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
